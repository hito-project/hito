[package]
name = "hito-storage-sqlite"
description = "The HITO storage adapter: .hito files as SQLite databases."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# An adapter depends on the core, and on domains where it needs their types.
# Never on the app or a UI toolkit.
[dependencies]
hito-core.workspace = true
# Change records are encoded with postcard, whose wire format is stable since
# 1.0 (ADR 0024). Without its default features it adds only cobs.
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }

[package]
name = "hito-pack-ar"
description = "The Argentine regional pack: data and rules from the CIRSOC codes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hito-core.workspace = true
hito-structural.workspace = true
# Values in the data files are written with their units and read through the
# unit catalogue.
hito-units.workspace = true
# The data files are TOML: readable by an engineer reviewing them, with
# comments and one line per value. Both are MIT OR Apache-2.0, pure Rust.
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
# Snapshot tests lock reviewed engineering tables (Apache-2.0, pure Rust).
insta = { version = "1.49", default-features = false }

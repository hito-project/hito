[package]
name = "hito"
description = "The HITO desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
hito-core.workspace = true
hito-architectural.workspace = true
hito-structural.workspace = true
hito-storage-sqlite.workspace = true
hito-units.workspace = true
hito-geometry.workspace = true
hito-manifold.workspace = true

# The UI toolkit lives in this crate only, so it can be swapped without
# touching the core, domains or adapters (ADR 0015). `persistence` saves the
# window layout between sessions in the platform's data folder.
eframe = { version = "0.36", features = ["persistence"] }
egui_dock = { version = "0.21", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

# User-facing text comes from Fluent message files, one per locale (ADR 0015).
fluent-bundle = "0.16"
unic-langid = { version = "0.9", features = ["macros"] }

# Unicode decomposition, so typed commands match ignoring accents. Pure Rust,
# Unicode-3.0; eframe already builds it (through url and idna).
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }

# The 3D view: camera and matrix maths in f64, so a model far from the
# origin keeps its precision, and vertex data laid out for wgpu. Pure Rust,
# MIT OR Apache-2.0; eframe already builds bytemuck.
glam = "0.34"
bytemuck = { version = "1.25", features = ["derive"] }

[dev-dependencies]
# Drives the window headless through its AccessKit tree (ADR 0015).
egui_kittest = { version = "0.36", features = ["eframe", "wgpu"] }

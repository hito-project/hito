name: Bug report
description: Something doesn't work as expected
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HITO version and operating system
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Logs, screenshots or a sample project file

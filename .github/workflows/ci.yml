# Checks every pull request and every push to main. All jobs are required
# status checks on main:
#
#   Format       rustfmt
#   Licenses     dependency licenses are MIT/Apache-2.0 compatible (ADR 0009,
#                deny.toml)
#   Lint and test, on Linux, Windows and macOS
#                clippy with warnings as errors, then the build and the tests.
#                The tests include the architecture's dependency rules and the
#                check that every non-Rust dependency is justified (ADR 0005),
#                both in tools/architecture-check. HITO_REQUIRE_GPU is set on
#                every runner, so the 3D view test must render: on Linux with
#                Mesa's software Vulkan driver (lavapipe), installed here, on
#                Windows with the built-in software adapter, on macOS with the
#                runner's Metal device.
#   Fuzz         the STEP Part 21 reader on arbitrary bytes for a few minutes
#                (ADR 0022). It needs nightly, so it's a separate job. Pull
#                requests that don't touch the reader or this file pass at
#                once; pushes to main always fuzz.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rustup is preinstalled on GitHub's runners; this installs the
      # toolchain pinned in rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all --check

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check dependency licenses
        run: cargo deny --locked check licenses

  lint-and-test:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # The 3D view test fails, instead of skipping, if it finds no adapter.
      HITO_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Install a software Vulkan driver (lavapipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - name: Install the Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Lint (warnings fail the build)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - name: Test (includes the dependency rules)
        run: cargo test --workspace --locked
      # Shows whether the 3D view test rendered, and with which adapter.
      - name: 3D view test output
        run: cargo test -p hito --locked --test shell the_3d_view_renders_with_wgpu -- --nocapture

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    # Locally, from crates/adapters/step: the same command, with a nightly
    # toolchain and `cargo install cargo-fuzz`.
    defaults:
      run:
        working-directory: crates/adapters/step
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Fuzz is a required check, so it always runs, but it only spends three
      # minutes when the reader or this workflow changed. The job still
      # succeeds when it skips, which is what the required check needs.
      - name: Check whether the reader changed
        id: changed
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ] || ! git diff --quiet "origin/$BASE...HEAD" -- \
              crates/adapters/step .github/workflows/ci.yml; then
            echo "fuzz=true" >> "$GITHUB_OUTPUT"
          else
            echo "The STEP reader didn't change; nothing to fuzz."
          fi
      # cargo-fuzz needs nightly for the sanitizer and coverage flags.
      - name: Install a nightly toolchain
        if: steps.changed.outputs.fuzz == 'true'
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        if: steps.changed.outputs.fuzz == 'true'
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.fuzz == 'true'
        with:
          workspaces: crates/adapters/step/fuzz
      # The prebuilt cargo-fuzz is a static musl binary and would build for
      # musl by default, where the sanitizer can't run; name the glibc target.
      - name: Fuzz the Part 21 reader for three minutes
        if: steps.changed.outputs.fuzz == 'true'
        run: |
          mkdir -p fuzz/corpus/read
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu \
            read fuzz/corpus/read fuzz/seeds/read -- \
            -dict=fuzz/read.dict -max_total_time=180 -max_len=65536 \
            -timeout=10 -rss_limit_mb=2048
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/adapters/step/fuzz/artifacts

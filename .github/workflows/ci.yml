# Checks every pull request and every push to main. All jobs are required
# status checks on main:
#
#   Format       rustfmt
#   Licenses     dependency licenses are MIT/Apache-2.0 compatible (ADR 0009,
#                deny.toml)
#   Lint and test, on Linux, Windows and macOS
#                clippy with warnings as errors, then the build and the tests.
#                The tests include the architecture's dependency rules and the
#                check that every non-Rust dependency is justified (ADR 0005),
#                both in tools/architecture-check.
#   Fuzz         the STEP Part 21 reader on arbitrary bytes for a few minutes
#                (ADR 0022). It needs nightly, so it's a separate job.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rustup is preinstalled on GitHub's runners; this installs the
      # toolchain pinned in rust-toolchain.toml.
      - name: Install the Rust toolchain
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --all --check

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the Rust toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check dependency licenses
        run: cargo deny --locked check licenses

  lint-and-test:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install the Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Lint (warnings fail the build)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - name: Test (includes the dependency rules)
        run: cargo test --workspace --locked

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    # Locally, from crates/adapters/step: the same command, with a nightly
    # toolchain and `cargo install cargo-fuzz`.
    defaults:
      run:
        working-directory: crates/adapters/step
    steps:
      - uses: actions/checkout@v5
      # cargo-fuzz needs nightly for the sanitizer and coverage flags.
      - name: Install a nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/adapters/step/fuzz
      # The prebuilt cargo-fuzz is a static musl binary and would build for
      # musl by default, where the sanitizer can't run; name the glibc target.
      - name: Fuzz the Part 21 reader for three minutes
        run: |
          mkdir -p fuzz/corpus/read
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu \
            read fuzz/corpus/read fuzz/seeds/read -- \
            -dict=fuzz/read.dict -max_total_time=180 -max_len=65536 \
            -timeout=10 -rss_limit_mb=2048
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: crates/adapters/step/fuzz/artifacts

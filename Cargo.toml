# The crates mirror the architecture (docs/architecture/unified-core.md):
#
#   crates/core        The shared core. Depends on no other HITO crate and no UI.
#   crates/geometry    The geometry port (ADR 0014): solids described by their
#                      parameters, meshed and cached per element. Depends on the
#                      core only.
#   crates/domains/*   Discipline schemas. Depend on the core and the geometry
#                      port.
#   crates/adapters/*  Storage, geometry kernels, solvers, importers/exporters and
#                      renderers behind the ports. Depend on the core, the
#                      geometry port and domains, never on the app or a UI
#                      toolkit.
#   crates/app         The desktop application. The only crate that may use a
#                      UI toolkit.
#
# tools/architecture-check enforces these rules as part of `cargo test`.
[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/geometry",
    "crates/domains/*",
    "crates/adapters/*",
    "crates/app",
    "tools/architecture-check",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hito-project/hito"
publish = false

[workspace.dependencies]
hito-core = { path = "crates/core" }
hito-geometry = { path = "crates/geometry" }
hito-architectural = { path = "crates/domains/architectural" }
hito-structural = { path = "crates/domains/structural" }
hito-manifold = { path = "crates/adapters/manifold" }
hito-storage-sqlite = { path = "crates/adapters/storage-sqlite" }
hito-step = { path = "crates/adapters/step" }
hito-units = { path = "crates/adapters/units" }
hito-pack-ar = { path = "crates/adapters/pack-ar" }

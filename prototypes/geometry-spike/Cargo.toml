[workspace]
resolver = "3"
members = ["common", "k-boolmesh", "k-truck", "k-monstertruck", "k-csgrs", "k-manifold"]
# k-occt is built separately (see README): it links a system OCCT.
exclude = ["k-occt"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
debug = false

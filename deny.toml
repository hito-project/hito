# cargo-deny configuration. CI runs `cargo deny check licenses`.
#
# HITO is MIT OR Apache-2.0 (ADR 0009), so every dependency must be under a
# license that lets us ship it in a permissively licensed program. Copyleft
# licenses (GPL, AGPL, LGPL, MPL) are not on the list: a crate offering one of
# them only as an alternative ("MIT OR LGPL-2.1") still passes, a crate under
# one alone fails. Adding a license here is a decision to record in an ADR.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "Unicode-3.0",
    # Fonts bundled by egui (epaint_default_fonts). Both allow redistribution
    # inside any program; they cover the font files, not our code.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[licenses.private]
# HITO's own crates are never published; their license comes from the workspace.
ignore = true
